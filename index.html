<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <section class="login-scene">

        <div class="orb orb-top-left" aria-hidden="true"></div>
        <div class="orb orb-left" aria-hidden="true"></div>
        <div class="orb orb-top-right" aria-hidden="true"></div>
        <div class="orb orb-right" aria-hidden="true"></div>
        <div class="orb orb-bottom-left" aria-hidden="true"></div>
        <div class="orb orb-bottom-right" aria-hidden="true"></div>

        <form class="login-card" action="#">
            <h1>Login</h1>

            <div class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <a class="forgot-password" href="#">Forgot password?</a>

            <button class="login-button" type="submit">Login</button>
        </form>

    </section>
</main>

</body>

</html>
